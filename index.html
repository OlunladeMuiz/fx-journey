<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FX Journey</title>
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="FX Journey is a 12-week forex self-education tracker with AI quiz, trade journal, streak tracking, and premium dark and white themes."
    />
    <script>
      (function () {
        try {
          var storageKey = "ui:theme";
          var storedTheme = localStorage.getItem(storageKey);
          var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = storedTheme === "light" || storedTheme === "dark" ? storedTheme : prefersLight ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute("content", theme === "light" ? "#ffffff" : "#080c10");
          }
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
